<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Revision OS</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #ffffff; color: #18181b; padding: 1rem; }
      @media (prefers-color-scheme: dark) { body { background: #121214; color: #ececf0; } }
      main { max-width: 26rem; text-align: center; }
      button { font: inherit; padding: 0.5rem 1rem; border-radius: 6px; border: 0; background: #4f46e5; color: #ffffff; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Revision OS needs a connection to your server. It will be back as soon as you are.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>

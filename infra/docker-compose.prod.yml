# The production stack (docs/deployment.md). From the repo root on the server:
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
#
# (or `make prod-up`). Only the web server is reachable from outside, on
# ports 80 and 443; it gets an HTTPS certificate for DOMAIN by itself.
# Nothing here mounts source code: what runs is what was built.

name: revision-os-prod

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../infra/backend.Dockerfile
  image: revision-os-backend:prod
  env_file: ${ENV_FILE:-../.env}
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    REDIS_URL: redis://redis:6379/0
    # Used when STORAGE_BACKEND=local (the default); with s3 the files live
    # in your bucket instead.
    STORAGE_LOCAL_ROOT: /data/storage
    MODEL_CACHE_DIR: /data/models
  volumes:
    - appdata:/data
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Persist the job queue across restarts.
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    # Migrations run before the API starts. The API sits behind Caddy, so it
    # trusts the client address and https scheme Caddy forwards (it is not
    # reachable any other way).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.asgi:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"

  worker:
    <<: *backend
    command: arq app.workers.settings.WorkerSettings
    mem_limit: 2g

  scheduler:
    <<: *backend
    command: arq app.workers.scheduler.SchedulerSettings
    mem_limit: 512m

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/web.Dockerfile
    image: revision-os-web:prod
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your site name, or localhost)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]

  # A database dump when it starts and then once a day, kept for
  # BACKUP_KEEP_DAYS days in ./backups on the server. Copy them off the server
  # too (docs/deployment.md); the export in Settings is your second backup.
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: >
      sh -c 'while true; do
               f=/backups/revision-os-$$(date -u +%Y%m%d-%H%M).dump;
               pg_dump --format=custom --file="$$f.part" && mv "$$f.part" "$$f" &&
                 echo "backup: $$f";
               find /backups -name "revision-os-*.dump" -mtime +$$KEEP_DAYS -delete;
               sleep 86400;
             done'
    volumes:
      - ../backups:/backups
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  appdata:
  caddy_data:
  caddy_config:

# Local development stack. Run from the repo root: `make dev`
# (= docker compose -f infra/docker-compose.yml --env-file .env up --build)
#
# Ports bind to 127.0.0.1 only, so nothing is exposed to your network.

name: revision-os

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../infra/backend.Dockerfile
    args:
      WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-false}
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_ROOT: /data/storage
    # Embedding models download here once and persist in the volume.
    MODEL_CACHE_DIR: /data/models
    # Docker Desktop on Windows/macOS does not deliver file-change events
    # into containers, so the dev auto-reload has to poll.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    # Uploaded files, shared by the API (writes) and the worker (reads).
    - uploads:/data
    - ../backend/app:/app/app:ro
    - ../backend/config:/app/config:ro
    - ../backend/migrations:/app/migrations:ro
    - ../backend/scripts:/app/scripts:ro
    # Your local golden set for `make eval-search` (a git-ignored folder).
    - ../samples:/samples:ro
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: arq app.workers.settings.WorkerSettings --watch app
    # Hard memory ceiling for document parsing (ARCHITECTURE.md section 12).
    mem_limit: 2g

  # Cron jobs (ARCHITECTURE.md section 4): pushes reminders to your devices.
  scheduler:
    <<: *backend
    command: arq app.workers.scheduler.SchedulerSettings --watch app
    mem_limit: 512m

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Fetches the pinned Python and R runtimes once (checksummed; served from
    # this origin like in production), then installs and starts Vite.
    command: sh -c "sh scripts/fetch-runtimes.sh && corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      # File changes from the host aren't seen through the mount; poll (vite.config.ts).
      VITE_POLL: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Keep pnpm's package cache out of the bind-mounted project folder.
      npm_config_store_dir: /pnpm-store
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ../frontend:/app
      # Keep the container's Linux node_modules separate from the host's.
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    depends_on: [api]

volumes:
  pgdata:
  uploads:
  frontend_node_modules:
  pnpm_store:

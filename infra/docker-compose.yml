# Local development stack. Run from the repo root: `make dev`
# (= docker compose -f infra/docker-compose.yml --env-file .env up --build)
#
# Ports bind to 127.0.0.1 only, so nothing is exposed to your network.

name: revision-os

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../infra/backend.Dockerfile
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ../backend/app:/app/app:ro
    - ../backend/config:/app/config:ro
    - ../backend/migrations:/app/migrations:ro
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: arq app.workers.settings.WorkerSettings --watch app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ../frontend:/app
      # Keep the container's Linux node_modules separate from the host's.
      - frontend_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  frontend_node_modules:

version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      # One PR for routine bumps; majors still arrive one at a time.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: weekly }
    ignore:
      # The Python version is a deliberate choice (pyproject requires-python,
      # uv.lock, CI). Change it by hand, not via a bot bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

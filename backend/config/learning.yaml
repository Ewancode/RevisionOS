# Tunable parameters for the adaptive learning engine.
# Formulas: docs/algorithms.md (from ARCHITECTURE.md section 10).
# Validated on startup by app/core/config.py — invalid values stop the app.
# Sections are added in the phase that first uses them.

mastery:
  # Attempt weight halves every `half_life_days`: w = d * 2^(-age / h)
  half_life_days: 21
  # Accuracy is smoothed towards p0 with weight alpha, so one correct answer
  # never reads as 100%.
  prior_accuracy: 0.5        # p0
  prior_weight: 2            # alpha
  # strength = lambda * p_hat + (1 - lambda) * mean flashcard retrievability
  flashcard_blend_lambda: 0.7
  # Below this total attempt weight the UI labels a topic "low data".
  low_data_weight_threshold: 5
  # Low-confidence AI marks count this fraction of a normal attempt.
  low_confidence_mark_weight: 0.5
  difficulty_weights:
    easy: 0.6
    medium: 1.0
    hard: 1.4
    exam: 1.7

difficulty:
  # Starting Elo-style rating of a new question, by its label; real outcomes
  # recalibrate it from Phase 7 (ARCHITECTURE.md section 10).
  initial_ratings:
    easy: 1350
    medium: 1500
    hard: 1650
    exam: 1800
  # Question selection aims for this predicted probability of success.
  target_success:
    min: 0.65
    max: 0.80
  # Elo-style ability per topic: P(correct) = 1 / (1 + 10^((b - theta) / 400)).
  initial_ability: 1500
  # After each answer: theta += k_ability * (score - P); b -= k_question * (score - P).
  k_ability: 32
  k_question: 16

spaced_repetition:
  # FSRS desired retention.
  target_retention: 0.90
  # Every card in an exam's topics is seen at least once in this window
  # (applied once exams exist, Phase 8).
  exam_final_window_days: 14
  # Short steps while a card is new or after a lapse, then FSRS intervals.
  learning_steps_minutes: [1, 10]
  relearning_steps_minutes: [10]
  maximum_interval_days: 3650
  # Spread due dates slightly so cards learnt together do not stay together.
  fuzz: true
  new_cards_per_day: 20

mistakes:
  # A category becomes "recurring" at this many occurrences in one topic
  # within the window.
  recurring_min_count: 3
  recurring_window_days: 30
  # Mistake descriptions at least this similar are shown as one pattern.
  description_similarity: 0.9
  categories:
    - arithmetic_or_algebra_slip
    - sign_error
    - wrong_method
    - concept_confusion
    - incomplete_justification
    - instance_instead_of_general
    - notation

daily_quiz:
  # priority = weakness*(1 - strength) + overdue*overdue + urgency*urgency
  #          + recurring*recurring + gap*gap   (each term in [0, 1])
  weights:
    weakness: 1.0
    overdue: 0.6
    urgency: 1.0       # exam proximity; zero until exams exist (Phase 8)
    recurring: 0.8
    gap: 0.5
  # A topic is fully overdue this many days after it was last practised.
  overdue_after_days: 7
  # The coverage gap closes after this many answered questions in a topic.
  coverage_attempts: 3
  # Quiz length = minutes / your median time per question, clamped.
  default_minutes: 15
  default_seconds_per_question: 90
  min_questions: 5
  max_questions: 20
  # Every active module with questions gets at least this many.
  module_floor: 1
  # Questions per quiz aimed at recurring mistakes.
  recurring_targets: 2
  # Questions answered right within this many days are not repeated.
  avoid_repeat_days: 2
  # When a topic has too few questions, Claude writes some (auto-saved after
  # passing the checks, as SPEC 40 allows for quiz questions). Skipped once
  # the AI budget warning is reached.
  top_up:
    enabled: true
    min_questions_per_topic: 3
    generate: 4
    max_topics_per_day: 2

profile:
  # A new snapshot (with Claude's summary) at most this often.
  refresh_days: 7
  # Error categories are counted over this many most recent mistakes.
  recent_errors: 20
  min_answers: 10

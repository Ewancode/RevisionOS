# Coding practice (SPEC 37, 38; ARCHITECTURE.md sections 1 and 9).
# Code runs in your browser (Pyodide for Python, WebR for R), never on the
# server. Validated on startup by app/core/config.py.

runtimes:
  # Pinned versions, served from this app's own origin: the security audit
  # (docs/security.md) found that loading them from a CDN let a third party
  # change code running on our origin. frontend/scripts/fetch-runtimes.sh
  # downloads them, checks their SHA-256 and puts them in public/runtimes/;
  # the versions here must match it (a test checks).
  python:
    label: Python
    base_url: /runtimes/pyodide/314.0.7/
    # Packages (numpy, pandas, ...) come from Pyodide's CDN, but each is
    # checked against the SHA-256 in the self-hosted lock file before it runs.
    package_url: https://cdn.jsdelivr.net/pyodide/v314.0.7/full/
  r:
    label: R
    base_url: /runtimes/webr/0.6.0/
    # R packages an exercise names are installed from the WebR project's
    # repository (not checksum-verified: see docs/security.md). The
    # Content-Security-Policy (infra/Caddyfile) must allow both origins.
    package_url: https://repo.r-wasm.org/

limits:
  # A run (or a test run) taking longer is stopped and the runtime restarted.
  run_timeout_seconds: 15
  # The first run also downloads the runtime; it gets longer.
  first_run_timeout_seconds: 120
  max_output_chars: 20000
  max_code_chars: 20000
  max_tests: 20
  max_test_chars: 4000
  max_packages: 10

generation:
  default_items: 2
  max_items: 4

tutor:
  # Previous hints sent back to Claude with each new one, for continuity.
  history_hints: 4
  max_student_work_chars: 6000

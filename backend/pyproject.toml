[project]
name = "revision-os-backend"
version = "0.1.0"
description = "Revision OS API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.0",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "anthropic>=1.0",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypandoc-binary>=1.13",
    "pillow>=11",
    "pillow-heif>=0.18",
    "tzdata>=2024.1",
    "fastembed>=0.5",
    "sympy>=1.14.0",
    "fsrs>=6.3.2",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "testcontainers[postgres]>=4.8",
    "fakeredis>=2.26",
    "types-openpyxl>=3.1.5.20260827",
    "hypothesis>=6.168.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = []
# Mathematical symbols are deliberate in a maths app.
allowed-confusables = ["×", "−", "∪", "∨", "–", "›"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]  # asserts, fixture passwords, small fixture files
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*", "pypandoc.*", "pillow_heif.*", "sympy.*", "pywebpush.*", "py_vapid.*", "http_ece.*"]
ignore_missing_imports = true

# PyMuPDF and SymPy ship without type hints; allow calling them where used.
[[tool.mypy.overrides]]
module = ["app.ingestion.*", "app.services.documents", "app.practice.maths", "tests.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs a real PostgreSQL with pgvector (Testcontainers or TEST_DATABASE_URL)",
    "samples: runs on your own files in ../samples; local only, never in CI",
]
# Your own files are opt-in: `pytest -m samples`.
addopts = "-m 'not samples'"
